<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
a.btn{color:var(--fg);text-decoration:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: egy oszlopos, telefonra szabott katalógus; ragadós keresősáv, alatta szűrők, majd sztorikártyák szalagszámláló-szerű időbélyeggel */
:root{
  --bg:#15121c; --surface:#1e1a28; --surface2:#262132; --line:#322b40;
  --fg:#efeaf5; --muted:#a39cb3; --accent:#ffb347; --on-accent:#1a1206;
  --good:#5fd39a; --warn:#ff8a6b;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f6f3fa; --surface:#ffffff; --surface2:#f0ebf6; --line:#e2dbeb;
  --fg:#1b1724; --muted:#655d74; --accent:#b96300; --on-accent:#ffffff;
  --good:#1d8a57; --warn:#c2410c; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f6f3fa; --surface:#ffffff; --surface2:#f0ebf6; --line:#e2dbeb;
  --fg:#1b1724; --muted:#655d74; --accent:#b96300; --on-accent:#ffffff;
  --good:#1d8a57; --warn:#c2410c; color-scheme:light }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 80px;display:flex;flex-direction:column;gap:18px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.1rem,9vw,3rem);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 .k{color:var(--accent)}
.tag-line{font-family:var(--f-display);font-weight:500;color:var(--muted);font-size:1.05rem}
.stats{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

.roulette{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);flex:1 1 180px;justify-content:center;font-size:1.05rem}
.btn.ghost{background:transparent}

.pick{border:2px solid var(--accent);border-radius:16px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px}
.pick-label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

.searchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-block:-8px}
.searchbar input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
.searchbar input::placeholder{color:var(--muted)}

.filters{display:flex;flex-direction:column;gap:12px}
.frow{display:flex;flex-direction:column;gap:6px}
.flabel{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.more{background:none;border:0;color:var(--accent);font-weight:600;padding:0;align-self:flex-start;font-size:.9rem}

.resultbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.resultbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:.88rem}

.list{display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start}
.card.done{opacity:.55}
.card.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){.card.flash{animation:none;box-shadow:0 0 0 3px var(--accent)}}
.counter{grid-row:span 2;display:flex;flex-direction:column;align-items:center;gap:4px;width:98px}
.ep{font-family:var(--f-mono);font-weight:700;font-size:.8rem;color:var(--muted)}
.time{font-family:var(--f-mono);font-weight:700;font-size:1.15rem;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.body{min-width:0;display:flex;flex-direction:column;gap:6px}
.title{font-weight:600;font-size:1.02rem;line-height:1.3;overflow-wrap:anywhere}
.title.empty{color:var(--muted);font-style:italic;font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.pill.who{border-style:dashed}
.pill.dur{font-family:var(--f-mono);font-weight:500}
.pill.own{border-color:var(--accent);color:var(--accent)}
.note{font-size:.82rem;color:var(--warn);display:flex;gap:6px}
.eptitle{font-size:.82rem;color:var(--muted)}
.actions{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.act{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:.85rem;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.act[aria-pressed="true"].fav{color:var(--accent);border-color:var(--accent)}
.act[aria-pressed="true"].dn{color:var(--good);border-color:var(--good)}
.act svg{width:16px;height:16px}
.empty-state{text-align:center;color:var(--muted);padding:32px 8px;border:1px dashed var(--line);border-radius:14px}

details.add{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.add summary{padding:14px 16px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.add summary::-webkit-details-marker{display:none}
details.add summary::after{content:"+";font-family:var(--f-mono);color:var(--accent);font-size:1.3rem}
details.add[open] summary::after{content:"−"}
form{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
form .btn.primary{flex:none}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
form input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
.hint{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:20}
footer{color:var(--muted);font-size:.8rem;display:flex;flex-direction:column;gap:8px}
footer a{color:var(--accent)}
.acct{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.acct form{padding:0}
.acct .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.88rem}
.acct .row button{background:none;border:0;color:var(--accent);font-weight:600;padding:0}
.err{color:var(--warn);font-size:.85rem}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.sync.ok{background:var(--good)}.sync.busy{background:var(--accent)}.sync.bad{background:var(--warn)}
</style>
</head>

      <button class="btn primary" type="submit">Mentés</button>
      <span class="hint">A kezdést írhatod így is: 1:12:30, 53:00 vagy simán 53 (perc).</span>
    </form>
  </details>

  <section class="acct" id="acct"></section>
</div>

const CFG=window.PK_CONFIG||{}; const API=(CFG.supabaseUrl||"").replace(/\/$/,"");
const STORE="pk-store-v1", AUTH="pk-auth-v1";
let store={rows:{},dirty:{},lastSync:0};
try{const s=JSON.parse(localStorage.getItem(STORE)||"null"); if(s) store=Object.assign(store,s);}catch(e){}
let auth=null; try{auth=JSON.parse(localStorage.getItem(AUTH)||"null")}catch(e){}
const saveStore=()=>{try{localStorage.setItem(STORE,JSON.stringify(store))}catch(e){}};
const saveAuth=()=>{try{auth?localStorage.setItem(AUTH,JSON.stringify(auth)):localStorage.removeItem(AUTH)}catch(e){}};
let S={fav:{},done:{},own:[]};
function rebuild(){S={fav:{},done:{},own:[]};
  for(const [id,r] of Object.entries(store.rows)){ if(r.deleted) continue; const d=r.data||{};
    if(d.fav) S.fav[id]=1; if(d.done) S.done[id]=1; if(d.story) S.own.push(d.story);}
}
rebuild();
function put(id,data){store.rows[id]={data,updated_at:new Date().toISOString(),deleted:false};store.dirty[id]=1;saveStore();rebuild();scheduleSync()}
function setFlag(id,k,v){const r=store.rows[id];const d={...(r&&!r.deleted?r.data:{})};if(v)d[k]=true;else delete d[k];put(id,d)}
function delRow(id){const r=store.rows[id];store.rows[id]={data:r?r.data:{},updated_at:new Date().toISOString(),deleted:true};store.dirty[id]=1;saveStore();rebuild();scheduleSync()}

function setSession(j){auth={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,user_id:j.user?j.user.id:auth.user_id,email:j.user?j.user.email:auth.email};saveAuth()}
async function authCall(grant,body){
  const r=await fetch(API+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:CFG.supabaseKey,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({})); if(!r.ok){const e=new Error(j.error_description||j.msg||j.message||"auth");e.status=r.status;throw e} return j;
}
async function refresh(){
  try{setSession(await authCall("refresh_token",{refresh_token:auth.refresh_token}))}
  catch(e){if(e.status>=400&&e.status<500){auth=null;saveAuth();drawAcct()}throw e}
}
async function api(path,opts={}){
  if(!auth) throw new Error("auth");
  if(Date.now()>auth.expires_at-60000) await refresh();
  const call=()=>fetch(API+path,{...opts,headers:{apikey:CFG.supabaseKey,Authorization:"Bearer "+auth.access_token,"Content-Type":"application/json",...(opts.headers||{})}});
  let r=await call(); if(r.status===401){await refresh();r=await call()}
  if(!r.ok) throw new Error("http "+r.status); return r;
}
let syncState="idle",syncing=null,syncTimer;
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(sync,700)}
function sync(){
  if(!auth||!API) return Promise.resolve();
  if(syncing) return syncing;
  if(!navigator.onLine){syncState="offline";drawAcct();return Promise.resolve()}
  syncState="syncing";drawAcct();
  syncing=(async()=>{
    try{
      const ks=Object.keys(store.dirty);
      if(ks.length){
        const rows=ks.map(id=>({user_id:auth.user_id,id,data:store.rows[id].data,updated_at:store.rows[id].updated_at,deleted:!!store.rows[id].deleted}));
        await api("/rest/v1/podkedd?on_conflict=user_id,id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
        for(const r of rows) if(store.rows[r.id]&&store.rows[r.id].updated_at===r.updated_at) delete store.dirty[r.id];
      }
      const rows=await (await api("/rest/v1/podkedd?select=id,data,updated_at,deleted")).json();
      const seen=new Set();
      for(const r of rows){seen.add(r.id); if(store.dirty[r.id]) continue; store.rows[r.id]={data:r.data,updated_at:r.updated_at,deleted:r.deleted}}
      for(const id of Object.keys(store.rows)) if(!seen.has(id)&&!store.dirty[id]) delete store.rows[id];
      store.lastSync=Date.now();saveStore();rebuild();syncState="idle";render();
    }catch(e){syncState=navigator.onLine?"error":"offline"}
    finally{syncing=null;drawAcct()}
  })();
  return syncing;
}
const loginUI={err:"",busy:false};
function drawAcct(){
  const el=document.getElementById("acct"); if(!el) return;
  if(!API){el.innerHTML='<div class="row">A szinkron nincs beállítva.</div>';return}
  if(auth){
    const st={idle:["ok","Szinkronban"],syncing:["busy","Szinkronizál…"],error:["bad","Szinkron hiba, újrapróbálom"],offline:["bad","Offline, később szinkronizál"]}[syncState]||["","" ];
    const n=Object.keys(store.dirty).length;
    el.innerHTML=`<div class="row"><span><span class="sync ${st[0]}"></span>${st[1]}${n&&syncState!=="syncing"?` (${n} vár)`:""}</span></div>
      <div class="row">${esc(auth.email||"")} · <button type="button" id="logout">Kilépés</button></div>`;
    document.getElementById("logout").onclick=e=>{ if(e.target.dataset.sure){auth=null;saveAuth();syncState="idle";drawAcct()} else {e.target.dataset.sure=1;e.target.textContent=n?`${n} változás még nincs fent. Biztos?`:"Biztos?"} };
    return;
  }
  let pre=""; try{pre=(JSON.parse(localStorage.getItem("szk-auth-v1")||"null")||{}).email||""}catch(e){}
  el.innerHTML=`<span class="flabel">Szinkron a telefon és a Mac között</span>
    <form id="loginForm">
      <label>E-mail<input id="lEmail" type="email" autocomplete="username" value="${esc(pre)}" required></label>
      <label>Jelszó<input id="lPw" type="password" autocomplete="current-password" required></label>
      ${loginUI.err?`<span class="err">${esc(loginUI.err)}</span>`:""}
      <button class="btn primary" type="submit" ${loginUI.busy?"disabled":""}>${loginUI.busy?"Belépés…":"Belépés"}</button>
      <span class="hint">Ugyanaz a fiók, mint a Chordsban. Belépés nélkül is működik, csak akkor minden ezen az eszközön marad.</span>
    </form>`;
  document.getElementById("loginForm").onsubmit=async e=>{
    e.preventDefault(); loginUI.busy=true; loginUI.err=""; const em=lEmail.value.trim(), pw=lPw.value; drawAcct();
    try{setSession(await authCall("password",{email:em,password:pw})); for(const id of Object.keys(store.rows)) store.dirty[id]=1; saveStore(); loginUI.busy=false; drawAcct(); sync();}
    catch(err){loginUI.busy=false; loginUI.err=err.status===400?"Hibás e-mail vagy jelszó.":"Nem sikerült belépni, ellenőrizd a netet."; drawAcct();}
  };
}
const toObj=(a,own)=>({ep:a[0],start:a[1],title:a[2],dur:a[3],tags:a[4]||[],who:a[5]||[],note:a[6]||"",own:!!own,id:(own?"u":"")+a[0]+"-"+a[1]});
const all=()=>BASE.map(a=>toObj(a)).concat(S.own.map(a=>toObj(a,true)));

const fmt=s=>{const h=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;const p=n=>String(n).padStart(2,"0");return h?`${h}:${p(mm)}:${p(ss)}`:`${mm}:${p(ss)}`};
const parseT=t=>{t=String(t).trim(); if(!t) return null; const p=t.split(/[:.]/).map(x=>parseInt(x,10)); if(p.some(isNaN)) return null;
  if(p.length===1) return p[0]*60; if(p.length===2) return p[0]*60+p[1]; return p[0]*3600+p[1]*60+p[2];};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

const F={q:"",time:"any",tags:new Set(),who:new Set(),show:"all",sort:"asc"};
const TIMES=[["any","Bármennyi"],["10","10 perc"],["20","20 perc"],["45","45 perc"],["whole","Egész adás"]];
const SHOWS=[["all","Mind"],["new","Még nem hallgattam"],["fav","Kedvencek"],["check","Ellenőrizendő"]];

function chipRow(el,items,isOn,onTap){
  el.innerHTML=items.map(([k,l])=>`<button type="button" class="chip" data-k="${esc(k)}" aria-pressed="${isOn(k)}">${esc(l)}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest(".chip"); if(!b) return; onTap(b.dataset.k); render();};
}
function drawFilters(){
  chipRow(fTime,TIMES,k=>F.time===k,k=>F.time=k);
  chipRow(fTag,Object.entries(TAGS),k=>F.tags.has(k),k=>F.tags.has(k)?F.tags.delete(k):F.tags.add(k));
  chipRow(fWho,WHO.map(w=>[w,w]),k=>F.who.has(k),k=>F.who.has(k)?F.who.delete(k):F.who.add(k));
  chipRow(fShow,SHOWS,k=>F.show===k,k=>F.show=k);
}

function filtered(){
  const q=norm(F.q.trim());
  let L=all().filter(s=>{
    if(q){const hay=norm(`e${s.ep} ${s.title} ${s.who.join(" ")} ${s.tags.map(t=>TAGS[t]).join(" ")} ${EPT[s.ep]||""}`); if(!q.split(/\s+/).every(w=>hay.includes(w))) return false;}
    if(F.time==="whole"){ if(s.dur!==-1) return false; }
    else if(F.time!=="any"){ if(s.dur==null||s.dur<0||s.dur>+F.time) return false; }
    if(F.tags.size && !s.tags.some(t=>F.tags.has(t))) return false;
    if(F.who.size && !s.who.some(w=>F.who.has(w))) return false;
    if(F.show==="new" && S.done[s.id]) return false;
    if(F.show==="fav" && !S.fav[s.id]) return false;
    if(F.show==="check" && !s.note && s.title) return false;
    return true;
  });
  const d=s=>s.dur==null?999:(s.dur<0?998:s.dur);
  L.sort((a,b)=>F.sort==="short"?d(a)-d(b)||a.ep-b.ep:(F.sort==="desc"?b.ep-a.ep||b.start-a.start:a.ep-b.ep||a.start-b.start));
  return L;
}

const icStar='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
const icCheck='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const icCopy='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

function card(s,inPick){
  const dur=s.dur===-1?'<span class="pill dur">egész adás</span>':(s.dur!=null?`<span class="pill dur">~${s.dur} perc</span>`:"");
  const tags=s.tags.map(t=>`<span class="pill">${esc(TAGS[t]||t)}</span>`).join("");
  const who=s.who.map(w=>`<span class="pill who">${esc(w)}</span>`).join("");
  const own=s.own?'<span class="pill own">saját</span>':"";
  const sp=`https://open.spotify.com/search/${encodeURIComponent("PODkedd E"+s.ep)}`;
  return `<article class="card${S.done[s.id]&&!inPick?" done":""}" id="${inPick?"":"c-"+s.id}">
    <div class="counter"><span class="ep">E${s.ep}</span><span class="time">${fmt(s.start)}</span></div>
    <div class="body">
      <div class="title${s.title?"":" empty"}">${s.title?esc(s.title):"Téma nincs megadva"}</div>
      ${EPT[s.ep]?`<div class="eptitle">${esc(EPT[s.ep])}</div>`:""}
      <div class="meta">${dur}${tags}${who}${own}</div>
      ${s.note?`<div class="note">${esc(s.note)}</div>`:""}
    </div>
    <div class="actions">
      <button type="button" class="act fav" data-a="fav" data-id="${s.id}" aria-pressed="${!!S.fav[s.id]}" aria-label="Kedvenc">${icStar}</button>
      <button type="button" class="act dn" data-a="done" data-id="${s.id}" aria-pressed="${!!S.done[s.id]}">${icCheck}${S.done[s.id]?"Meghallgattam":"Hallgattam"}</button>
      <button type="button" class="act" data-a="copy" data-id="${s.id}">${icCopy}Időpont</button>
      <a class="act" href="${sp}" target="_blank" rel="noopener">Spotify</a>
      ${s.own?`<button type="button" class="act" data-a="del" data-id="${s.id}">Törlés</button>`:""}
    </div>
  </article>`;
}

let pickId=null;
function render(){
  drawFilters();
  const L=filtered(), A=all();
  stats.textContent=`${A.length} sztori · ${new Set(A.map(s=>s.ep)).size} rész · ${Object.keys(S.done).length} meghallgatva`;
  count.textContent=`${L.length} találat`;
  list.innerHTML=L.length?L.map(s=>card(s)).join(""):'<div class="empty-state">Nincs ilyen sztori. Lazíts a szűrőkön, vagy vedd fel újként lent.</div>';
  const p=pickId&&A.find(s=>s.id===pickId);
  pick.hidden=!p;
  if(p) pick.innerHTML=`<span class="pick-label">A rulett ezt dobta</span>${card(p,true)}`;
}

function toast(t){toastEl.textContent=t; toastEl.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>toastEl.hidden=true,1800);}
const toastEl=document.getElementById("toast");

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const id=b.dataset.id, s=all().find(x=>x.id===id); if(!s) return;
  const a=b.dataset.a;
  if(a==="fav"){setFlag(id,"fav",!S.fav[id]); render();}
  if(a==="done"){setFlag(id,"done",!S.done[id]); render();}
  if(a==="del"){ if(b.dataset.sure){delRow(id); if(pickId===id) pickId=null; render(); toast("Törölve");}
    else {b.dataset.sure="1"; b.textContent="Biztos?"; setTimeout(()=>{if(b.isConnected){delete b.dataset.sure; b.textContent="Törlés";}},3000);} }
  if(a==="copy"){const t=`E${s.ep} ${fmt(s.start)}`; copy(t);}
});
function copy(t,label){
  const done=()=>toast(label||`Másolva: ${t}`);
  try{navigator.clipboard.writeText(t).then(done,()=>fallback(t,done));}catch(e){fallback(t,done)}
}
function fallback(t,cb){const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); cb();}catch(e){toast(t)} ta.remove();}

spin.onclick=()=>{
  let L=filtered(); const fresh=L.filter(s=>!S.done[s.id]&&s.title); if(fresh.length) L=fresh;
  if(!L.length){toast("Nincs mit pörgetni ezekkel a szűrőkkel"); return;}
  let n=L[Math.floor(Math.random()*L.length)];
  if(L.length>1) while(n.id===pickId) n=L[Math.floor(Math.random()*L.length)];
  pickId=n.id; render(); pick.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});
};

q.addEventListener("input",()=>{F.q=q.value; render();});
sort.onchange=()=>{F.sort=sort.value; render();};

const nTagSel=new Set();
function drawNTags(){chipRow(nTags,Object.entries(TAGS),k=>nTagSel.has(k),k=>{nTagSel.has(k)?nTagSel.delete(k):nTagSel.add(k); drawNTags();});}
drawNTags();
addForm.addEventListener("submit",e=>{
  e.preventDefault();
  const ep=parseInt(nEp.value,10), st=parseT(nStart.value), d=nDur.value.trim()?parseInt(nDur.value,10):null;
  if(!ep||st==null){toast("Add meg a rész számát és a kezdést (pl. 1:12:30)"); return;}
  if(S.own.some(o=>o[0]===ep&&o[1]===st)||BASE.some(o=>o[0]===ep&&o[1]===st)){toast("Ez a sztori már benne van"); return;}
  const who=nWho.value.split(",").map(x=>x.trim()).filter(Boolean);
  put("u"+ep+"-"+st,{story:[ep,st,nTitle.value.trim(),isNaN(d)?null:d,[...nTagSel],who]});
  addForm.reset(); nTagSel.clear(); drawNTags(); render();
  const el=document.getElementById("c-u"+ep+"-"+st);
  if(el){el.scrollIntoView({block:"center"}); el.classList.add("flash");} else toast("Elmentve, a szűrők miatt most nem látszik");
});
render(); drawAcct(); sync();
addEventListener("online",sync);
document.addEventListener("visibilitychange",()=>{if(!document.hidden) sync()});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
