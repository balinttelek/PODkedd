<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PODkedd</title>
<meta name="description" content="Kedvenc PODkedd-sztorik időbélyegekkel">
<meta name="theme-color" content="#ecebe7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PODkedd">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: egy oszlop, felül a műsor borítója a fa asztallal, alatta piros ADÁS-gombos rulett, majd kézzel rajzolt papírkártyák. Egyetlen, világos "akvarell papír" világ. */
:root{
  --paper:#ecebe7; --paper-hi:#f7f6f2; --card:#fbfaf7;
  --ink:#1d1b18; --muted:#66615a; --line:#2b2824;
  --wood:#8a5c30; --wood-dk:#6e4824;
  --red:#d6302a; --red-dk:#9e1f1a; --yellow:#f3d53c; --green:#6cbf47; --blue:#2f63b6;
  --f-hand:"Gochi Hand","Patrick Hand","Marker Felt","Chalkboard SE","Comic Sans MS",cursive;
  --f-label:"Patrick Hand","Chalkboard SE","Comic Sans MS",cursive;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --wobble:14px 19px 12px 21px / 19px 12px 20px 14px;
  color-scheme:light;
}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  background-color:var(--paper);
  background-image:
    radial-gradient(ellipse 40% 28% at 12% 18%, rgba(120,116,108,.16), transparent 70%),
    radial-gradient(ellipse 35% 22% at 88% 32%, rgba(120,116,108,.13), transparent 70%),
    radial-gradient(ellipse 50% 30% at 30% 72%, rgba(120,116,108,.12), transparent 70%),
    radial-gradient(ellipse 30% 20% at 80% 88%, rgba(120,116,108,.14), transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 50%, rgba(255,255,255,.5), transparent 75%);
  background-attachment:fixed;
}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:14px 60px;display:flex;flex-direction:column;gap:18px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header{display:flex;flex-direction:column;gap:8px}
.cover{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:var(--wobble);border:2.5px solid var(--line);box-shadow:4px 5px 0 var(--line);background:var(--paper-hi)}
.stats{font-family:var(--f-label);font-size:1.05rem;color:var(--muted);text-align:center}
.stats b{color:var(--ink);font-weight:400}

.roulette{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.btn{border:2.5px solid var(--line);background:var(--card);border-radius:var(--wobble);padding:10px 16px;font-family:var(--f-label);font-size:1.15rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:3px 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
a.btn{color:var(--ink);text-decoration:none}
.btn.adas{flex:1 1 200px;background:var(--red);color:#fff;font-family:var(--f-hand);font-size:1.6rem;letter-spacing:.02em;padding:12px 16px;border-radius:999px/70%;box-shadow:0 5px 0 var(--red-dk),0 5px 0 2.5px var(--line)}
.btn.adas:active{transform:translateY(4px);box-shadow:0 1px 0 var(--red-dk),0 1px 0 2.5px var(--line)}
.btn.adas small{font-family:var(--f-label);font-size:.85rem;opacity:.9;display:block;line-height:1;margin-top:2px}
.adas-in{display:flex;flex-direction:column;align-items:center;line-height:1.05}
form .btn{flex:none}

.pick{border:2.5px solid var(--line);border-radius:var(--wobble);background:var(--yellow);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:4px 5px 0 var(--line)}
.pick-label{font-family:var(--f-hand);font-size:1.35rem;line-height:1}
.pick .card{box-shadow:none}

.searchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:8px;margin-block:-8px;background:var(--paper)}
.searchbar input{width:100%;border:2.5px solid var(--line);background:var(--card);border-radius:var(--wobble);padding:11px 14px;font-size:16px}
.searchbar input::placeholder{color:var(--muted)}

.filters{display:flex;flex-direction:column;gap:12px}
.frow{display:flex;flex-direction:column;gap:6px}
.flabel{font-family:var(--f-label);font-size:1.25rem;line-height:1;color:var(--wood-dk)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-size:.92rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--yellow);font-weight:700;box-shadow:2px 2px 0 var(--line)}
#fWho .chip{display:inline-flex;align-items:center;gap:6px}
#fWho .chip .dot{width:11px;height:11px;border-radius:50%;background:var(--pc);border:1.5px solid var(--line)}
#fWho .chip[aria-pressed="true"]{background:var(--pc);color:var(--pt)}
#fWho .chip[aria-pressed="true"] .dot{border-color:var(--pt)}

.resultbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-family:var(--f-label);font-size:1.05rem}
.resultbar select{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:5px 8px;font-family:var(--f-body);font-size:.88rem}

.list{display:flex;flex-direction:column;gap:14px}
.card{border:2.5px solid var(--line);background:var(--card);border-radius:var(--wobble);padding:12px 14px 14px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 14px;align-items:start;box-shadow:3px 4px 0 var(--line)}
.card:nth-child(3n+2){border-radius:19px 13px 21px 12px / 13px 20px 12px 19px}
.card:nth-child(3n){border-radius:12px 21px 15px 18px / 21px 14px 19px 12px}
.card.done{opacity:.55}
.card.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:var(--yellow)}100%{background:var(--card)}}
@media (prefers-reduced-motion: reduce){.card.flash{animation:none;background:var(--yellow)}.btn{transition:none}}
.counter{grid-row:span 2;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.ep{font-family:var(--f-hand);font-size:2.6rem;line-height:.9;color:var(--ink);font-variant-numeric:tabular-nums}
.ep-l{font-family:var(--f-label);font-size:.85rem;color:var(--muted);line-height:1}
.time{margin-top:6px;font-family:var(--f-label);font-size:1rem;line-height:1.1;color:var(--red-dk);border-top:2px dashed var(--line);padding-top:5px;width:100%}
.body{min-width:0;display:flex;flex-direction:column;gap:6px}
.title{font-weight:700;font-size:1.05rem;line-height:1.3;overflow-wrap:anywhere}
.title.empty{color:var(--muted);font-style:italic;font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:.8rem;color:var(--muted)}
.pill{border:1.5px solid var(--muted);border-radius:999px;padding:1px 8px}
.pill.who{background:var(--pc);color:var(--pt);border:1.5px solid var(--line);font-weight:700}
.pill.dur{border-color:var(--wood);color:var(--wood-dk);font-weight:600}
.pill.own{border-color:var(--blue);color:var(--blue)}
.note{font-size:.84rem;color:var(--red-dk);font-family:var(--f-label);font-size:1rem;line-height:1.25}
.eptitle{font-size:.82rem;color:var(--muted)}
.actions{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.act{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:5px 10px;font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.act[aria-pressed="true"].fav{background:var(--yellow)}
.act[aria-pressed="true"].dn{background:var(--green)}
.act svg{width:16px;height:16px}
.empty-state{text-align:center;color:var(--muted);padding:28px 8px;border:2.5px dashed var(--muted);border-radius:var(--wobble);font-family:var(--f-label);font-size:1.15rem}

details.add{border:2.5px solid var(--line);border-radius:var(--wobble);background:var(--card);box-shadow:3px 4px 0 var(--line)}
details.add summary{padding:12px 16px;font-family:var(--f-hand);font-size:1.4rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.add summary::-webkit-details-marker{display:none}
details.add summary::after{content:"+";color:var(--red);font-size:1.8rem;line-height:1}
details.add[open] summary::after{content:"−"}
form{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
form input{border:2px solid var(--line);background:var(--paper-hi);border-radius:10px;padding:9px 11px;font-size:16px;width:100%}
.hint{font-size:.82rem;color:var(--muted)}
.btn.save{background:var(--green);font-family:var(--f-hand);font-size:1.4rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper-hi);padding:10px 16px;border-radius:12px;font-family:var(--f-label);font-size:1.1rem;z-index:20;box-shadow:3px 3px 0 var(--red)}

.update{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:12px;white-space:nowrap;background:var(--yellow);color:var(--ink);border:2.5px solid var(--line);border-radius:var(--wobble);box-shadow:3px 4px 0 var(--line);padding:10px 14px;font-family:var(--f-label);font-size:1.1rem}
.update b{background:var(--red);color:#fff;border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:400}
.table{margin-top:10px;height:46px;border-radius:12px 12px 0 0;background:linear-gradient(var(--wood-dk) 0 5px,var(--wood) 5px);border:2.5px solid var(--line);border-bottom:0;position:relative}
.acct{display:flex;flex-direction:column;gap:10px}
.acct form{padding:0}
.acct .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.acct .row button{background:none;border:0;color:var(--red-dk);font-weight:700;padding:0;text-decoration:underline}
.err{color:var(--red-dk);font-size:.88rem;font-weight:600}
.sync{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle;border:1.5px solid var(--line)}
.sync.ok{background:var(--green)}.sync.busy{background:var(--yellow)}.sync.bad{background:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="vh">PODkedd sztoritár</h1>
    <img class="cover" src="img/borito.jpg" width="1280" height="720" alt="PODkedd, lehetőleg kedden, majdnem gamer podcast: balról jobbra Balázs, Alex, Covery, GoodLike és Lali rajzolt karikatúrája az asztal körül">
    <div class="stats" id="stats"></div>
  </header>

  <div class="roulette">
    <button class="btn adas" id="spin" type="button"><span class="adas-in">Sztori-rulett<small>adás!</small></span></button>
    <a class="btn ghost" href="https://open.spotify.com/show/35n2VJXXTErdasYxrj5Abc" target="_blank" rel="noopener">Spotify</a>
  </div>
  <section id="pick" class="pick" hidden></section>

  <div class="searchbar"><input id="q" type="search" placeholder="Keresés: pizzafutár, LAN, Covery, E88…" autocomplete="off"></div>

  <section class="filters">
    <div class="frow"><span class="flabel">Mennyi időd van?</span><div class="chips" id="fTime"></div></div>
    <div class="frow"><span class="flabel">Téma</span><div class="chips" id="fTag"></div></div>
    <div class="frow"><span class="flabel">Ki meséli</span><div class="chips" id="fWho"></div></div>
    <div class="frow"><span class="flabel">Mutasd</span><div class="chips" id="fShow"></div></div>
  </section>

  <div class="resultbar">
    <span id="count"></span>
    <label style="flex-direction:row;align-items:center;gap:6px">Sorrend
      <select id="sort"><option value="asc">Rész szerint ↑</option><option value="desc">Rész szerint ↓</option><option value="short">Legrövidebb elöl</option></select>
    </label>
  </div>

  <div class="list" id="list"></div>

  <details class="add" id="add">
    <summary>Új sztori hozzáadása</summary>
    <form id="addForm" autocomplete="off">
      <div class="grid3">
        <label>Rész<input id="nEp" inputmode="numeric" placeholder="88" required></label>
        <label>Kezdés<input id="nStart" placeholder="1:12:30" required></label>
        <label>Hossz (perc)<input id="nDur" inputmode="numeric" placeholder="15"></label>
      </div>
      <label>Miről szól<input id="nTitle" placeholder="Covery IKEA-s félreértése" required></label>
      <label>Ki meséli (vesszővel)<input id="nWho" placeholder="Covery, Balázs (ahogy a szűrőben)"></label>
      <div class="frow"><span class="flabel">Téma</span><div class="chips" id="nTags"></div></div>
      <button class="btn save" type="submit">Mentés</button>
      <span class="hint">A kezdést írhatod így is: 1:12:30, 53:00 vagy simán 53 (perc).</span>
    </form>
  </details>

  <div class="table" aria-hidden="true"></div>
  <section class="acct" id="acct"></section>
</div>
<div class="toast" id="toast" hidden></div>
<button type="button" class="update" id="upd" hidden>Új verzió érhető el <b>Frissítés</b></button>

const CFG=window.PK_CONFIG||{}; const API=(CFG.supabaseUrl||"").replace(/\/$/,"");
const STORE="pk-store-v1", AUTH="pk-auth-v1";
let store={rows:{},dirty:{},lastSync:0};
try{const s=JSON.parse(localStorage.getItem(STORE)||"null"); if(s) store=Object.assign(store,s);}catch(e){}
let auth=null; try{auth=JSON.parse(localStorage.getItem(AUTH)||"null")}catch(e){}
const saveStore=()=>{try{localStorage.setItem(STORE,JSON.stringify(store))}catch(e){}};
const saveAuth=()=>{try{auth?localStorage.setItem(AUTH,JSON.stringify(auth)):localStorage.removeItem(AUTH)}catch(e){}};
let S={fav:{},done:{},own:[]};
function rebuild(){S={fav:{},done:{},own:[]};
  for(const [id,r] of Object.entries(store.rows)){ if(r.deleted) continue; const d=r.data||{};
    if(d.fav) S.fav[id]=1; if(d.done) S.done[id]=1; if(d.story) S.own.push(d.story);}
}
rebuild();
function put(id,data){store.rows[id]={data,updated_at:new Date().toISOString(),deleted:false};store.dirty[id]=1;saveStore();rebuild();scheduleSync()}
function setFlag(id,k,v){const r=store.rows[id];const d={...(r&&!r.deleted?r.data:{})};if(v)d[k]=true;else delete d[k];put(id,d)}
function delRow(id){const r=store.rows[id];store.rows[id]={data:r?r.data:{},updated_at:new Date().toISOString(),deleted:true};store.dirty[id]=1;saveStore();rebuild();scheduleSync()}

function setSession(j){auth={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,user_id:j.user?j.user.id:auth.user_id,email:j.user?j.user.email:auth.email};saveAuth()}
async function authCall(grant,body){
  const r=await fetch(API+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:CFG.supabaseKey,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({})); if(!r.ok){const e=new Error(j.error_description||j.msg||j.message||"auth");e.status=r.status;throw e} return j;
}
async function refresh(){
  try{setSession(await authCall("refresh_token",{refresh_token:auth.refresh_token}))}
  catch(e){if(e.status>=400&&e.status<500){auth=null;saveAuth();drawAcct()}throw e}
}
async function api(path,opts={}){
  if(!auth) throw new Error("auth");
  if(Date.now()>auth.expires_at-60000) await refresh();
  const call=()=>fetch(API+path,{...opts,headers:{apikey:CFG.supabaseKey,Authorization:"Bearer "+auth.access_token,"Content-Type":"application/json",...(opts.headers||{})}});
  let r=await call(); if(r.status===401){await refresh();r=await call()}
  if(!r.ok) throw new Error("http "+r.status); return r;
}
let syncState="idle",syncing=null,syncTimer;
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(sync,700)}
function sync(){
  if(!auth||!API) return Promise.resolve();
  if(syncing) return syncing;
  if(!navigator.onLine){syncState="offline";drawAcct();return Promise.resolve()}
  syncState="syncing";drawAcct();
  syncing=(async()=>{
    try{
      const ks=Object.keys(store.dirty);
      if(ks.length){
        const rows=ks.map(id=>({user_id:auth.user_id,id,data:store.rows[id].data,updated_at:store.rows[id].updated_at,deleted:!!store.rows[id].deleted}));
        await api("/rest/v1/podkedd?on_conflict=user_id,id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
        for(const r of rows) if(store.rows[r.id]&&store.rows[r.id].updated_at===r.updated_at) delete store.dirty[r.id];
      }
      const rows=await (await api("/rest/v1/podkedd?select=id,data,updated_at,deleted")).json();
      const seen=new Set();
      for(const r of rows){seen.add(r.id); if(store.dirty[r.id]) continue; store.rows[r.id]={data:r.data,updated_at:r.updated_at,deleted:r.deleted}}
      for(const id of Object.keys(store.rows)) if(!seen.has(id)&&!store.dirty[id]) delete store.rows[id];
      store.lastSync=Date.now();saveStore();rebuild();syncState="idle";render();
    }catch(e){syncState=navigator.onLine?"error":"offline"}
    finally{syncing=null;drawAcct()}
  })();
  return syncing;
}
const loginUI={err:"",busy:false};
function drawAcct(){
  const el=document.getElementById("acct"); if(!el) return;
  if(!API){el.innerHTML='<div class="row">A szinkron nincs beállítva.</div>';return}
  if(auth){
    const st={idle:["ok","Szinkronban"],syncing:["busy","Szinkronizál…"],error:["bad","Szinkron hiba, újrapróbálom"],offline:["bad","Offline, később szinkronizál"]}[syncState]||["","" ];
    const n=Object.keys(store.dirty).length;
    el.innerHTML=`<div class="row"><span><span class="sync ${st[0]}"></span>${st[1]}${n&&syncState!=="syncing"?` (${n} vár)`:""}</span></div>
      <div class="row">${esc(auth.email||"")} · <button type="button" id="logout">Kilépés</button></div>`;
    document.getElementById("logout").onclick=e=>{ if(e.target.dataset.sure){auth=null;saveAuth();syncState="idle";drawAcct()} else {e.target.dataset.sure=1;e.target.textContent=n?`${n} változás még nincs fent. Biztos?`:"Biztos?"} };
    return;
  }
  let pre=""; try{pre=(JSON.parse(localStorage.getItem("szk-auth-v1")||"null")||{}).email||""}catch(e){}
  el.innerHTML=`<span class="flabel">Szinkron a telefon és a Mac között</span>
    <form id="loginForm">
      <label>E-mail<input id="lEmail" type="email" autocomplete="username" value="${esc(pre)}" required></label>
      <label>Jelszó<input id="lPw" type="password" autocomplete="current-password" required></label>
      ${loginUI.err?`<span class="err">${esc(loginUI.err)}</span>`:""}
      <button class="btn save" type="submit" ${loginUI.busy?"disabled":""}>${loginUI.busy?"Belépés…":"Belépés"}</button>
      <span class="hint">Ugyanaz a fiók, mint a Chordsban. Belépés nélkül is működik, csak akkor minden ezen az eszközön marad.</span>
    </form>`;
  document.getElementById("loginForm").onsubmit=async e=>{
    e.preventDefault(); loginUI.busy=true; loginUI.err=""; const em=lEmail.value.trim(), pw=lPw.value; drawAcct();
    try{setSession(await authCall("password",{email:em,password:pw})); for(const id of Object.keys(store.rows)) store.dirty[id]=1; saveStore(); loginUI.busy=false; drawAcct(); sync();}
    catch(err){loginUI.busy=false; loginUI.err=err.status===400?"Hibás e-mail vagy jelszó.":"Nem sikerült belépni, ellenőrizd a netet."; drawAcct();}
  };
}
const toObj=(a,own)=>({ep:a[0],start:a[1],title:a[2],dur:a[3],tags:a[4]||[],who:a[5]||[],note:a[6]||"",own:!!own,id:(own?"u":"")+a[0]+"-"+a[1]});
const all=()=>BASE.map(a=>toObj(a)).concat(S.own.map(a=>toObj(a,true)));

const fmt=s=>{const h=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;const p=n=>String(n).padStart(2,"0");return h?`${h}:${p(mm)}:${p(ss)}`:`${mm}:${p(ss)}`};
const perc=s=>{ if(!s) return "elejétől"; const h=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;
  let t=h?(mm?`${h} óra ${mm}. perc`:`${h} órától`):`${mm}. perc`; if(ss) t+=` ${ss} mp`; return t;};
const parseT=t=>{t=String(t).trim(); if(!t) return null; const p=t.split(/[:.]/).map(x=>parseInt(x,10)); if(p.some(isNaN)) return null;
  if(p.length===1) return p[0]*60; if(p.length===2) return p[0]*60+p[1]; return p[0]*3600+p[1]*60+p[2];};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

const F={q:"",time:"any",tags:new Set(),who:new Set(),show:"all",sort:"asc"};
const TIMES=[["any","Bármennyi"],["10","10 perc"],["20","20 perc"],["45","45 perc"],["whole","Egész adás"]];
const SHOWS=[["all","Mind"],["new","Még nem hallgattam"],["fav","Kedvencek"],["check","Ellenőrizendő"]];

function chipRow(el,items,isOn,onTap){
  el.innerHTML=items.map(([k,l])=>`<button type="button" class="chip" data-k="${esc(k)}" aria-pressed="${isOn(k)}"${el.id==="fWho"?` style="${shirt(k)}"`:""}>${el.id==="fWho"?'<i class="dot"></i>':""}${esc(l)}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest(".chip"); if(!b) return; onTap(b.dataset.k); render();};
}
function drawFilters(){
  chipRow(fTime,TIMES,k=>F.time===k,k=>F.time=k);
  chipRow(fTag,Object.entries(TAGS),k=>F.tags.has(k),k=>F.tags.has(k)?F.tags.delete(k):F.tags.add(k));
  chipRow(fWho,WHO.map(w=>[w,w]),k=>F.who.has(k),k=>F.who.has(k)?F.who.delete(k):F.who.add(k));
  chipRow(fShow,SHOWS,k=>F.show===k,k=>F.show=k);
}

function filtered(){
  const q=norm(F.q.trim());
  let L=all().filter(s=>{
    if(q){const hay=norm(`e${s.ep} ${s.title} ${s.who.join(" ")} ${s.tags.map(t=>TAGS[t]).join(" ")} ${EPT[s.ep]||""}`); if(!q.split(/\s+/).every(w=>hay.includes(w))) return false;}
    if(F.time==="whole"){ if(s.dur!==-1) return false; }
    else if(F.time!=="any"){ if(s.dur==null||s.dur<0||s.dur>+F.time) return false; }
    if(F.tags.size && !s.tags.some(t=>F.tags.has(t))) return false;
    if(F.who.size && !s.who.some(w=>F.who.has(w))) return false;
    if(F.show==="new" && S.done[s.id]) return false;
    if(F.show==="fav" && !S.fav[s.id]) return false;
    if(F.show==="check" && !s.note && s.title) return false;
    return true;
  });
  const d=s=>s.dur==null?999:(s.dur<0?998:s.dur);
  L.sort((a,b)=>F.sort==="short"?d(a)-d(b)||a.ep-b.ep:(F.sort==="desc"?b.ep-a.ep||b.start-a.start:a.ep-b.ep||a.start-b.start));
  return L;
}

function card(s,inPick){
  const dur=s.dur===-1?'<span class="pill dur">egész adás</span>':(s.dur!=null?`<span class="pill dur">~${s.dur} perc</span>`:"");
  const tags=s.tags.map(t=>`<span class="pill">${esc(TAGS[t]||t)}</span>`).join("");
  const who=s.who.map(w=>`<span class="pill who" style="${shirt(w)}">${esc(w)}</span>`).join("");
  const own=s.own?'<span class="pill own">saját</span>':"";
  const sp=`https://open.spotify.com/search/${encodeURIComponent("PODkedd E"+s.ep)}`;
  return `<article class="card${S.done[s.id]&&!inPick?" done":""}" id="${inPick?"":"c-"+s.id}">
    <div class="counter"><span class="ep-l">rész</span><span class="ep">${s.ep}</span><span class="time">${perc(s.start)}</span></div>
    <div class="body">
      <div class="title${s.title?"":" empty"}">${s.title?esc(s.title):"Téma nincs megadva"}</div>
      ${EPT[s.ep]?`<div class="eptitle">${esc(EPT[s.ep])}</div>`:""}
      <div class="meta">${dur}${tags}${who}${own}</div>
      ${s.note?`<div class="note">${esc(s.note)}</div>`:""}
    </div>
    <div class="actions">
      <button type="button" class="act fav" data-a="fav" data-id="${s.id}" aria-pressed="${!!S.fav[s.id]}" aria-label="Kedvenc">${icStar}</button>
      <button type="button" class="act dn" data-a="done" data-id="${s.id}" aria-pressed="${!!S.done[s.id]}">${icCheck}${S.done[s.id]?"Meghallgattam":"Hallgattam"}</button>
      <button type="button" class="act" data-a="copy" data-id="${s.id}">${icCopy}Időpont</button>
      <a class="act" href="${sp}" target="_blank" rel="noopener">Spotify</a>
      ${s.own?`<button type="button" class="act" data-a="del" data-id="${s.id}">Törlés</button>`:""}
    </div>
  </article>`;
}

const toastEl=document.getElementById("toast");

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const id=b.dataset.id, s=all().find(x=>x.id===id); if(!s) return;
  const a=b.dataset.a;
  if(a==="fav"){setFlag(id,"fav",!S.fav[id]); render();}
  if(a==="done"){setFlag(id,"done",!S.done[id]); render();}
  if(a==="del"){ if(b.dataset.sure){delRow(id); if(pickId===id) pickId=null; render(); toast("Törölve");}
    else {b.dataset.sure="1"; b.textContent="Biztos?"; setTimeout(()=>{if(b.isConnected){delete b.dataset.sure; b.textContent="Törlés";}},3000);} }
  if(a==="copy"){const t=`E${s.ep}, ${perc(s.start)}`; copy(t);}
});
function copy(t,label){
  const done=()=>toast(label||`Másolva: ${t}`);
  try{navigator.clipboard.writeText(t).then(done,()=>fallback(t,done));}catch(e){fallback(t,done)}
}
function fallback(t,cb){const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); cb();}catch(e){toast(t)} ta.remove();}

spin.onclick=()=>{
  let L=filtered(); const fresh=L.filter(s=>!S.done[s.id]&&s.title); if(fresh.length) L=fresh;
  if(!L.length){toast("Nincs mit pörgetni ezekkel a szűrőkkel"); return;}
  let n=L[Math.floor(Math.random()*L.length)];
  if(L.length>1) while(n.id===pickId) n=L[Math.floor(Math.random()*L.length)];
  pickId=n.id; render(); pick.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});
};

q.addEventListener("input",()=>{F.q=q.value; render();});
sort.onchange=()=>{F.sort=sort.value; render();};

const nTagSel=new Set();
function drawNTags(){chipRow(nTags,Object.entries(TAGS),k=>nTagSel.has(k),k=>{nTagSel.has(k)?nTagSel.delete(k):nTagSel.add(k); drawNTags();});}
drawNTags();
addForm.addEventListener("submit",e=>{
  e.preventDefault();
  const ep=parseInt(nEp.value,10), st=parseT(nStart.value), d=nDur.value.trim()?parseInt(nDur.value,10):null;
  if(!ep||st==null){toast("Add meg a rész számát és a kezdést (pl. 1:12:30)"); return;}
  if(S.own.some(o=>o[0]===ep&&o[1]===st)||BASE.some(o=>o[0]===ep&&o[1]===st)){toast("Ez a sztori már benne van"); return;}
  const who=nWho.value.split(",").map(x=>x.trim()).filter(Boolean);
  put("u"+ep+"-"+st,{story:[ep,st,nTitle.value.trim(),isNaN(d)?null:d,[...nTagSel],who]});
  addForm.reset(); nTagSel.clear(); drawNTags(); render();
  const el=document.getElementById("c-u"+ep+"-"+st);
  if(el){el.scrollIntoView({block:"center"}); el.classList.add("flash");} else toast("Elmentve, a szűrők miatt most nem látszik");
});
render(); drawAcct(); sync();
addEventListener("online",sync);
document.addEventListener("visibilitychange",()=>{if(!document.hidden) sync()});
if("serviceWorker" in navigator){
  // új verzió: az új service worker átveszi az irányítást, ekkor felajánljuk a frissítést
  let hadCtrl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(reg=>{
    const check=()=>{reg.update().catch(()=>{})};
    document.addEventListener("visibilitychange",()=>{if(!document.hidden) check()});
    setInterval(check,30*60*1000);
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(!hadCtrl){hadCtrl=true;return} document.getElementById("upd").hidden=false; });
  document.getElementById("upd").onclick=()=>location.reload();
}
</script>
</body>
</html>
